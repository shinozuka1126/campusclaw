<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusClaw{% endblock %}</title>
  <style>
    body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#252525;background:#fafafa}
    header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:1rem;margin-bottom:2rem}
    a{color:#8f1720} button{background:#8f1720;color:#fff;border:0;border-radius:5px;padding:.55rem 1rem;cursor:pointer}
    input[type=text],input[type=password],input[type=file]{padding:.55rem;border:1px solid #bbb;border-radius:4px;width:100%;box-sizing:border-box;margin:.3rem 0 1rem}
    .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem;margin-bottom:1rem}.error{color:#a00}.flash{background:#fff4d8;padding:.75rem;border-left:4px solid #d99400;margin-bottom:1rem}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #eee}
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
